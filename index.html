<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Family Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#2a1a10; --wood:#7a4a2b; --wood2:#8d5a35; --wood-d:#4a2c18; --wood-l:#b07a47;
  --parch:#f6e7c1; --parch2:#ead4a2; --ink:#3a2a1a; --edge:#241408; --gold:#ffcc4d; --green:#5fb760; --red:#d9534f;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#1c110a; --parch:#efdcae; } }
:root[data-theme="dark"]{ --bg:#1c110a; --parch:#efdcae; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'VT323','Courier New',monospace;font-size:22px;
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 2px,transparent 2px 46px),radial-gradient(ellipse at 50% 0%,#5b3820 0%,transparent 65%);
  background-attachment:fixed;overflow-x:hidden}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.hidden{display:none!important}
button{font-family:inherit;color:inherit;cursor:pointer}
.px{font-family:'Press Start 2P','Courier New',monospace}

/* audio buttons */
.audio{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:8px;z-index:60;display:flex;gap:6px}
.audio button{width:40px;height:40px;font-size:18px;background:var(--wood);border:3px solid var(--edge);box-shadow:inset -3px -3px 0 rgba(0,0,0,.3),inset 3px 3px 0 rgba(255,255,255,.2);border-radius:0;padding:0}
.audio button.off{opacity:.45}

.screen{max-width:760px;margin:0 auto;padding:18px 12px 48px}
.logo{font-family:'Press Start 2P',monospace;text-align:center;font-size:clamp(22px,7vw,40px);line-height:1.3;margin:18px 0 6px;color:var(--gold);
  text-shadow:3px 3px 0 #b5651d,6px 6px 0 var(--edge);letter-spacing:2px}
.sub{text-align:center;color:var(--parch);font-size:26px;margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{display:block;padding:6px 6px 8px;text-align:center;border:4px solid var(--edge);border-radius:0;
  background:repeating-linear-gradient(0deg,var(--wood) 0 14px,var(--wood2) 14px 16px);
  box-shadow:inset 3px 3px 0 rgba(255,255,255,.18),inset -3px -3px 0 rgba(0,0,0,.28),0 5px 0 var(--edge);color:var(--parch);transition:transform .08s}
.card:active{transform:translateY(3px);box-shadow:inset 3px 3px 0 rgba(255,255,255,.18),inset -3px -3px 0 rgba(0,0,0,.28),0 2px 0 var(--edge)}
.card canvas{width:100%;height:auto;border:3px solid var(--edge);background:#222}
.card .nm{font-family:'Press Start 2P',monospace;font-size:clamp(8px,2.6vw,12px);margin:8px 0 3px;color:var(--gold);text-shadow:1px 1px 0 var(--edge)}
.card .rk{font-size:clamp(14px,3.8vw,19px);line-height:1;color:var(--parch)}
.card.empty{background:repeating-linear-gradient(0deg,#6d5846 0 14px,#78644f 14px 16px);filter:saturate(.45) brightness(.9)}
.card.empty .ph{width:100%;aspect-ratio:26/22;border:3px dashed #3b2b1d;background:rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;
  font-family:'Press Start 2P',monospace;font-size:28px;color:#a8927a}
.card.empty .nm{color:#c4b49c}

/* quest screen */
.qtop{display:flex;align-items:center;gap:10px;margin:4px 0 14px;padding-right:96px}
.qname{font-family:'Press Start 2P',monospace;font-size:clamp(11px,3.4vw,16px);color:var(--gold);text-shadow:2px 2px 0 var(--edge);line-height:1.5}
.btn{font-family:'Press Start 2P',monospace;font-size:10px;padding:10px 12px;background:var(--wood-l);color:#2a1608;border:3px solid var(--edge);border-radius:0;
  box-shadow:inset 3px 3px 0 rgba(255,255,255,.35),inset -3px -3px 0 rgba(0,0,0,.25),0 3px 0 var(--edge)}
.btn:active{transform:translateY(2px)}
.btn.go{background:var(--green);color:#10260f}
.btn.gold{background:var(--gold)}
.btn.small{padding:8px 10px;font-size:9px}
.quest{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:700px){.quest{grid-template-columns:minmax(250px,310px) 1fr;align-items:start}}
.panel{border:4px solid var(--edge);padding:12px;box-shadow:inset 3px 3px 0 rgba(255,255,255,.2),inset -3px -3px 0 rgba(0,0,0,.25),0 5px 0 var(--edge)}
.hero{background:repeating-linear-gradient(0deg,var(--wood) 0 14px,var(--wood2) 14px 16px);color:var(--parch)}
.hero canvas{width:100%;max-width:300px;margin:0 auto;border:4px solid var(--edge)}
.plate{margin-top:10px;text-align:center}
.plate .rank{font-family:'Press Start 2P',monospace;font-size:11px;color:var(--gold);line-height:1.5;text-shadow:1px 1px 0 var(--edge)}
.plate .lv{font-size:24px;margin:2px 0}
.xp{height:18px;border:3px solid var(--edge);background:#2c1a0e;margin:4px 0 2px;position:relative}
.xp i{display:block;height:100%;background:repeating-linear-gradient(90deg,#7fe07a 0 6px,#5fb760 6px 8px);transition:width .5s}
.small-t{font-size:19px;opacity:.95;line-height:1.1}
.msg{background:#3c2a3f;border:3px solid var(--edge);color:#e9d8ff;padding:6px 8px;margin-top:8px;font-size:20px;line-height:1.1}
.scroll{background:var(--parch);position:relative}
.scroll h2{font-family:'Press Start 2P',monospace;font-size:13px;margin:0 0 4px;color:#6b3b16;line-height:1.5}
.day{font-size:20px;opacity:.75;margin-bottom:8px}
.prog{height:14px;border:3px solid var(--edge);background:#d7c08c;margin:6px 0 12px}
.prog i{display:block;height:100%;background:var(--gold);transition:width .4s}
.tl{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.tl li{display:flex;gap:6px}
.row{flex:1;display:flex;align-items:center;gap:12px;text-align:left;font-size:26px;line-height:1.05;padding:10px;background:#fff6dc;border:3px solid var(--edge);border-radius:0;
  box-shadow:inset -3px -3px 0 rgba(0,0,0,.12),0 3px 0 var(--edge);min-height:56px}
.row:active{transform:translateY(2px)}
.box{flex:none;width:34px;height:34px;border:3px solid var(--edge);background:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;font-weight:bold}
.dn .box{background:var(--green)}
.dn .row{background:#dff3d2;opacity:.9}
.dn .tx{text-decoration:line-through;text-decoration-thickness:2px}
.tin{flex:1;min-width:0;font-family:inherit;font-size:24px;padding:8px;border:3px solid var(--edge);background:#fff;color:var(--ink);border-radius:0}
.x{flex:none;width:44px;background:var(--red);color:#fff;border:3px solid var(--edge);font-size:20px;border-radius:0;padding:0}
.addrow{display:flex;gap:6px;margin-top:10px}
.addrow input{flex:1;min-width:0;font-family:inherit;font-size:24px;padding:8px;border:3px solid var(--edge);background:#fff;color:var(--ink);border-radius:0}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcard{position:relative;background:#fff6dc;border:3px solid var(--edge);padding:6px;box-shadow:0 3px 0 var(--edge)}
.pcard canvas{width:100%;height:auto;border:3px solid var(--edge)}
.pcard .btn{width:100%;margin-top:6px;font-size:9px;padding:11px 4px}
.pcard.dn{background:#dff3d2}
.pcard.dn::after{content:'✓';position:absolute;top:8px;left:8px;width:34px;height:34px;background:var(--green);border:3px solid var(--edge);color:#fff;font-size:26px;text-align:center;line-height:30px}
.pcard .x{position:absolute;top:8px;right:8px;width:34px;height:34px;font-size:16px}
.pcard .lab{font-size:19px;line-height:1;text-align:center;margin-top:5px}
.addc{min-height:140px;font-family:'Press Start 2P',monospace;font-size:30px;color:#6b3b16;background:repeating-linear-gradient(45deg,#f0dfb4 0 8px,#e8d3a0 8px 16px);border-style:dashed}
.bar{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;justify-content:center}

/* effects */
#fx{position:fixed;inset:0;pointer-events:none;z-index:120;overflow:hidden}
.pop{position:absolute;left:50%;top:26%;transform:translate(-50%,0);text-align:center;font-family:'Press Start 2P',monospace;font-size:clamp(12px,4vw,18px);line-height:1.6;
  color:#fff;background:#2f8f3a;border:4px solid var(--edge);padding:12px 16px;box-shadow:0 5px 0 var(--edge),inset 3px 3px 0 rgba(255,255,255,.3);white-space:nowrap;animation:pop 1.8s ease-out forwards}
.pop small{display:block;color:var(--gold);font-size:.75em}
@keyframes pop{0%{opacity:0;transform:translate(-50%,16px) scale(.5)}12%{opacity:1;transform:translate(-50%,0) scale(1.12)}22%{transform:translate(-50%,0) scale(1)}78%{opacity:1;transform:translate(-50%,-34px) scale(1)}100%{opacity:0;transform:translate(-50%,-70px) scale(1)}}
.conf{position:absolute;top:-14px;width:10px;height:10px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
#modal{position:fixed;inset:0;z-index:100;background:rgba(15,8,3,.72);display:flex;align-items:center;justify-content:center;padding:16px}
.mbox{width:100%;max-width:380px;background:var(--parch);border:4px solid var(--edge);box-shadow:0 6px 0 var(--edge),inset 3px 3px 0 rgba(255,255,255,.4);padding:16px;text-align:center;max-height:92vh;overflow:auto}
.mbox h3{font-family:'Press Start 2P',monospace;font-size:13px;line-height:1.6;margin:0 0 10px;color:#6b3b16}
.mbox h3.big{font-size:clamp(14px,4.4vw,19px);color:#c0392b}
.mbox input{width:100%;font-family:inherit;font-size:30px;text-align:center;letter-spacing:6px;border:3px solid var(--edge);padding:8px;background:#fff;color:var(--ink);border-radius:0}
.mbox .row2{display:flex;gap:8px;margin-top:12px}
.mbox .row2 .btn{flex:1}
.mbox .opt{display:block;width:100%;margin-top:8px;text-align:center;font-size:9px;line-height:1.6}
.err{color:#b3261e;min-height:24px;font-size:22px}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.cel canvas{width:200px;height:auto;margin:6px auto;border:4px solid var(--edge)}
#start{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(20,10,4,.82);text-align:center;padding:20px}
#start .go2{font-family:'Press Start 2P',monospace;font-size:13px;color:#10260f;background:var(--green);border:4px solid var(--edge);padding:16px 18px;box-shadow:0 5px 0 var(--edge);animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{filter:brightness(1.25)}}
/* treat time */
.gwrap canvas{width:100%;max-width:360px;margin:0 auto;border:4px solid var(--edge);touch-action:none;user-select:none;-webkit-user-select:none}
.hud{display:flex;align-items:center;gap:10px;max-width:360px;margin:0 auto 8px;font-family:'Press Start 2P',monospace;font-size:10px;color:var(--parch);min-height:22px}
.hud .tb{flex:1;height:16px;border:3px solid var(--edge);background:#2c1a0e}
.hud .tb i{display:block;height:100%;background:repeating-linear-gradient(90deg,#ffd34e 0 6px,#e8a92a 6px 8px)}
.hud .tb.fev i{background:repeating-linear-gradient(90deg,#ff7fa8 0 6px,#ff4d6d 6px 8px)}
.gp{text-align:center;margin-top:12px}
.gp h3{font-family:'Press Start 2P',monospace;font-size:13px;line-height:1.6;margin:0 0 6px;color:var(--gold);text-shadow:2px 2px 0 var(--edge)}
.gp p{margin:4px 0 8px;font-size:23px;line-height:1.1}
.gp .stars{font-size:38px;color:var(--gold);text-shadow:2px 2px 0 var(--edge);letter-spacing:4px}
.gp .newb{font-family:'Press Start 2P',monospace;font-size:11px;color:#ff9aa8;margin:4px 0}
.gp .btnrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.book{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.stk{background:var(--parch);color:var(--ink);border:3px solid var(--edge);padding:4px 2px;font-size:15px;line-height:1;min-height:62px}
.stk b{display:block;font-size:26px;font-weight:normal}
.stk.lock{filter:grayscale(1);opacity:.55}
.stk.new{animation:blink 1s steps(2) infinite;border-color:var(--gold)}
</style>
</head>
<body>
<div class="audio"><button id="bMusic" data-act="music" aria-label="Toggle music">🎵</button><button id="bSfx" data-act="sfx" aria-label="Toggle sound effects">🔔</button></div>
<main id="select" class="screen"></main>
<main id="questScreen" class="screen hidden"></main>
<main id="gameScreen" class="screen hidden"></main>
<div id="fx"></div>
<div id="modal" class="hidden"><div class="mbox" id="mbox"></div></div>
<div id="start">
  <div class="logo">FAMILY<br>QUEST</div>
  <button class="go2" data-act="start">TAP TO BEGIN ♪</button>
</div>

<script>
(()=>{
'use strict';
const PIN='4103', KEY='familyquest.v1';
const ORDER=['acacia','salem','roshan','elijah','simeon'];
const THRESH=[0,7,21,42,70,110,160,220,290,365];
const RANKS=['Tavern Newcomer','Tavern Helper','Apprentice','Squire','Adventurer','Knight','Champion','Hero','Legend','Grand Master'];
const GOLD='#ffd34e';
const CH={
 acacia:{id:'acacia',name:'Acacia',base:0,style:'acacia',sleeve:3,skin:'#f9d3ad',hair:'#f5c84c',hairD:'#d99f1e',hi:'#fde58f',eye:'#3a8dde',out:'#8fcdf3',outD:'#5ea8dc',pants:'#8a5a3b',shoe:'#6b3f22',acc:'#ff7fa8',bg:'#cfe9ff'},
 salem:{id:'salem',name:'Salem',base:2,style:'salem',sleeve:6,skin:'#f9d3ad',hair:'#f4d35e',hairD:'#d1ab2f',hi:'#fff0a0',eye:'#2f8cff',out:'#9aa3b0',outD:'#6f7886',pants:'#38527f',shoe:'#e8e8e8',acc:'#ff9f43',bg:'#ffe9c2'},
 roshan:{id:'roshan',name:'Roshan',base:1,style:'roshan',sleeve:6,skin:'#f3c49b',hair:'#b98a5a',hairD:'#8f6538',hi:'#d9b184',eye:'#6b3f1d',out:'#4caf50',outD:'#2f7d33',pants:'#3a4a6b',shoe:'#4a3320',acc:'#e8e45a',bg:'#d6f2d0'},
 elijah:{id:'elijah',name:'Elijah',base:3,style:'elijah',sleeve:5,skin:'#f6cba3',hair:'#6b4328',hairD:'#4b2e19',hi:'#8c5e3c',eye:'#6b3f1d',out:'#e0443e',outD:'#a82d29',pants:'#4a5d8f',shoe:'#3a2a1a',acc:'#5bc0eb',bg:'#ffd6d6',pic:true},
 simeon:{id:'simeon',name:'Simeon',base:4,style:'simeon',sleeve:5,skin:'#f9d3ad',hair:'#f5d77a',hairD:'#d6ae45',hi:'#fff0b0',eye:'#7f9fd0',out:'#e0443e',outD:'#a82d29',pants:'#5b6ea0',shoe:'#3a2a1a',acc:'#7bd88f',bg:'#e1d6ff',pic:true}
};
const KINDS={dress:'Get dressed',teeth:'Brush teeth',bowls:'Set out bowls, spoons & cereal',clean:'Clean up the room'};
const uid=()=>Math.random().toString(36).slice(2,8);
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const $=s=>document.querySelector(s);
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const tierFor=p=>{let t=0;THRESH.forEach((v,i)=>{if(p>=v)t=i});return t};
const levelOf=k=>Math.floor(k.exp/100)+1;

/* ---------- state ---------- */
function freshDay(){return{date:todayStr(),done:{},per:{},earned:0,awarded:false}}
function defaultKid(id){
  const c=CH[id];
  const tasks=c.pic?[{id:uid(),text:KINDS.dress,k:'dress'},{id:uid(),text:KINDS.teeth,k:'teeth'},{id:uid(),text:KINDS.bowls,k:'bowls'},{id:uid(),text:KINDS.clean,k:'clean'}]
    :['Make your bed','Brush teeth','Read for 20 minutes','Tidy your room','Help with the dishes'].map(t=>({id:uid(),text:t}));
  return{tasks,exp:0,perfect:0,misses:[],sad:false,day:freshDay()};
}
function load(){
  let s=null;try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  if(!s||!s.kids)s={music:true,sfx:true,kids:{}};
  ORDER.forEach(id=>{if(!s.kids[id])s.kids[id]=defaultKid(id);gstate(s.kids[id])});
  return s;
}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function rollover(){
  const today=todayStr();let changed=false;
  ORDER.forEach(id=>{
    const k=S.kids[id];
    if(k.day.date!==today){
      if(k.tasks.length&&!k.day.awarded){
        const ed=Math.min(k.exp,50),pd=k.perfect>0?1:0;
        k.exp-=ed;k.perfect-=pd;k.sad=true;
        k.misses.push({date:k.day.date,earned:k.day.earned,ed,pd});
        if(k.misses.length>10)k.misses.shift();
      }
      k.day=freshDay();changed=true;
    }
  });
  if(changed){save();if(inGame){}else if(cur)renderQuest();else renderSelect()}
}

/* ---------- sprite engine ---------- */
const T=document.createElement('canvas');T.width=32;T.height=40;
const OUTC=document.createElement('canvas');OUTC.width=32;OUTC.height=40;
const tg=T.getContext('2d'),og=OUTC.getContext('2d');
function drawSprite(c,o){
  const tier=o.tier||0,base=c.base,b=o.bob?1:0,j=o.jump||0,pose=o.pose||'idle',h=c.hair,d=c.hairD;
  tg.globalCompositeOperation='source-over';tg.clearRect(0,0,32,40);
  const U=(x,y,w,hh,col)=>{tg.fillStyle=col;tg.fillRect(4+x,4+y+base+b+j,w,hh)};
  const L=(x,y,w,hh,col)=>{tg.fillStyle=col;tg.fillRect(4+x,4+y+j,w,hh)};
  const out=o.pj?'#f6e8a6':c.out,outD=o.pj?'#d9c470':c.outD,sk=c.skin;
  // back layers
  if(tier>=9){U(-1,10,6,11,'#fff3b0');U(-1,9,3,2,'#fff8d6');U(19,10,6,11,'#fff3b0');U(22,9,3,2,'#fff8d6');U(0,19,3,3,'#ffe27a');U(21,19,3,3,'#ffe27a')}
  if(tier>=3){const len=tier>=5?13:8,cc=tier>=7?'#6a3fb5':tier>=5?'#2f6fd0':'#c0392b';U(6,15,12,len,cc);if(tier>=7)U(6,15+len-1,12,1,GOLD)}
  if(c.style==='acacia'){U(3,5,18,18,h);U(4,4,16,2,h);U(2,10,2,10,h);U(20,10,2,10,h);U(2,20,4,3,d);U(18,20,4,3,d);
    [[3,8],[5,12],[3,15],[5,19],[20,9],[18,13],[20,16],[18,20]].forEach(p=>U(p[0],p[1],2,2,d))}
  if(c.style==='simeon')U(3,4,18,9,h);
  // legs
  const lh=6-base;
  L(8,25+base,3,lh,c.pants);L(13,25+base,3,lh,c.pants);
  const shoe=tier>=4?'#7b4a1e':c.shoe;
  L(7,30,4,1,shoe);L(13,30,4,1,shoe);
  // torso
  if(c.style==='acacia'){U(7,15,10,12,out);U(6,24,12,3,out);U(6,26,12,1,'#fff');U(8,21,8,1,'#c98b3c');U(11,15,2,2,sk);U(8,18,1,3,outD);U(15,18,1,3,outD)}
  else U(8,15,8,10,out);
  if(c.style==='salem'){U(7,14,10,2,outD);U(10,16,1,4,'#fff');U(13,16,1,4,'#fff');U(9,21,6,3,outD)}
  if(c.style==='roshan'){U(7,14,10,2,outD);U(10,15,4,2,'#fff');U(8,24,8,1,'#fff');U(11,17,1,7,outD);U(11,17,1,1,GOLD)}
  if(c.style==='simeon'){U(7,14,10,2,outD);U(11,16,1,8,outD);U(11,16,1,1,GOLD);U(9,21,2,3,outD);U(13,21,2,3,outD)}
  if(c.style==='elijah'){U(9,15,6,1,outD);U(10,16,4,1,outD)}
  if(tier>=1){U(8,15,8,2,c.acc);U(14,17,2,4,c.acc)}
  if(tier>=2)U(8,22,8,1,'#7a4a1e'),U(11,22,2,1,GOLD);

/* ---------- audio ---------- */
let AC=null,master,musGain,timer=null,nextT=0,stepI=0;
const STEP=.24;
const MEL=[[76,0,79,0,84,0,79,76],[81,0,76,0,72,0,76,81],[77,0,81,0,84,0,81,77],[79,0,83,0,86,0,83,79],
           [84,0,83,81,79,0,76,79],[81,0,79,76,72,0,76,0],[77,79,81,84,81,0,77,0],[79,0,74,0,79,83,79,0]];
const BASS=[48,45,41,43],CHORD=[[60,64,67],[57,60,64],[60,65,69],[59,62,67]];
const midi=n=>440*Math.pow(2,(n-69)/12);
function ensureAudio(){
  if(!AC){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;
    AC=new A();master=AC.createGain();master.gain.value=.8;
    const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2600;
    musGain=AC.createGain();musGain.gain.value=1;musGain.connect(lp);lp.connect(master);master.connect(AC.destination)}
  if(AC.state==='suspended')AC.resume();
}
function tone(f,t0,dur,type,vol,dest){
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.012);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g);g.connect(dest||master);o.start(t0);o.stop(t0+dur+.05);
}
function playStep(s,t){
  const bar=s>>3,k=s&7,m=MEL[bar][k];
  if(m)tone(midi(m),t,STEP*1.6,'square',.03,musGain);
  const bs=BASS[bar%4],bn=[bs,0,bs+12,0,bs,0,bs+12,0][k];
  if(bn)tone(midi(bn),t,STEP*1.8,'triangle',.11,musGain);
  if(k%2===1)tone(midi(CHORD[bar%4][(k>>1)%3]),t,STEP*.9,'sine',.045,musGain);
}
function sched(){while(nextT<AC.currentTime+.5){playStep(stepI,nextT);nextT+=STEP;stepI=(stepI+1)%64}}
function startMusic(){ensureAudio();if(!AC||timer)return;nextT=AC.currentTime+.1;timer=setInterval(sched,120)}
function stopMusic(){clearInterval(timer);timer=null}
function sfx(kind){
  if(!S.sfx)return;ensureAudio();if(!AC)return;const t=AC.currentTime+.01;
  if(kind==='task'){[84,88,91,96].forEach((n,i)=>tone(midi(n),t+i*.07,.35,'sine',.16));tone(midi(108),t+.3,.4,'sine',.05)}
  if(kind==='fanfare'){[72,76,79,84,79,84,88,91,96].forEach((n,i)=>{tone(midi(n),t+i*.1,.3,'square',.07);tone(midi(n-12),t+i*.1,.3,'triangle',.1)})}
  if(kind==='sad'){[67,64,60].forEach((n,i)=>tone(midi(n),t+i*.2,.35,'triangle',.15))}
  if(kind==='tap')tone(midi(79),t,.08,'square',.05);
  if(kind==='catch')tone(midi(88),t,.09,'square',.05);
  if(kind==='gold'){[91,96,100,103].forEach((n,i)=>tone(midi(n),t+i*.06,.25,'sine',.14))}
  if(kind==='bonk'){tone(midi(45),t,.3,'sawtooth',.08);tone(midi(40),t+.08,.25,'triangle',.12)}
  if(kind==='fever'){[72,76,79,84,88].forEach((n,i)=>tone(midi(n),t+i*.07,.2,'square',.06))}
  if(kind==='power'){for(let i=0;i<10;i++)tone(midi(60+i*3),t+i*.06,.25,'sawtooth',.04)}
}

function award(id){
  const k=S.kids[id],d=k.day;if(d.awarded)return;
  const oldT=tierFor(k.perfect),oldL=levelOf(k);
  d.awarded=true;k.exp+=40;d.earned+=40;k.perfect+=1;k.sad=false;
  const newT=tierFor(k.perfect),newL=levelOf(k);save();
  if(cur===id&&!inGame)renderQuest();
  setTimeout(()=>{
    sfx('fanfare');
    let title=newT>oldT?'POWER UP!':'LEVEL UP!',sub=`${CH[id].name} reached Level ${newL}!`;
    if(newL<=oldL){title='QUEST COMPLETE!';sub=`${CH[id].name} finished every chore today!`}
    if(newT>oldT){sub+=`<br>New rank: <b>${RANKS[newT]}</b> and a new outfit!`;sfx('power')}
    celebrate(id,title,sub,roundsLeft(S.kids[id])>0);
  },1000);
}
function toggleTask(tid){
  const k=S.kids[cur],d=k.day,task=k.tasks.find(x=>x.id===tid);if(!task)return;
  if(d.done[tid]){
    if(d.awarded)return;
    k.exp=Math.max(0,k.exp-(d.per[tid]||0));d.earned-=d.per[tid]||0;delete d.done[tid];delete d.per[tid];save();renderQuest();sfx('tap');return;
  }
  const per=Math.round(60/Math.max(1,k.tasks.length));
  d.done[tid]=1;d.per[tid]=per;k.exp+=per;d.earned+=per;
  cheerUntil=performance.now()+1700;sfx('task');popup('TASK COMPLETE!','+'+per+' EXP');
  save();renderQuest();
  if(k.tasks.every(t=>d.done[t.id]))award(cur);
}
function completeToday(id){
  const k=S.kids[id],d=k.day,per=Math.round(60/Math.max(1,k.tasks.length));
  k.tasks.forEach(t=>{if(!d.done[t.id]){d.done[t.id]=1;d.per[t.id]=per;k.exp+=per;d.earned+=per}});
  save();renderQuest();award(id);
}
function forgive(id){
  const k=S.kids[id],m=k.misses.pop();if(!m)return false;
  const oldT=tierFor(k.perfect);
  k.exp+=m.ed+Math.max(0,100-m.earned);k.perfect+=m.pd+1;k.sad=k.misses.length>0&&false;
  save();renderQuest();

  return true;
}

  if(th.night){g.fillStyle='#fff';for(let i=0;i<14;i++)if(((t*2+i)|0)%3)g.fillRect((i*37)%58+1,(i*23)%50+2,1,1)}
  else{g.fillStyle='rgba(255,255,255,.85)';for(let i=0;i<3;i++){const x=((t*3+i*25)%80)-12,y=14+i*14;g.fillRect(x,y,10,3);g.fillRect(x+2,y-2,6,2)}}
  g.fillStyle='#4aa564';g.fillRect(0,64,22,12);g.fillRect(10,61,18,15);
  g.fillStyle='#43995c';g.fillRect(36,63,24,13);g.fillRect(42,60,12,5);
  g.fillStyle='#5fb760';g.fillRect(0,GH-5,GW,5);g.fillStyle='#86d97c';g.fillRect(0,GH-5,GW,1);g.fillStyle='#8a5a38';g.fillRect(0,GH-2,GW,2);

function burst(x,y,col){for(let i=0;i<7;i++)G.parts.push({x,y,vx:(Math.random()-.5)*40,vy:-Math.random()*30-8,life:.5,col})}
function spawnItem(){
  const little=CH[cur].pic,th=themeToday(),r=Math.random();let kind;
  if(r<(little?.08:.06))kind='golden';
  else if(!little&&G.elapsed>4&&r<.2)kind='mud';
  else kind=th.k[(Math.random()*3)|0];
  const v=little?14+Math.random()*4:20+G.elapsed*.22+Math.random()*7;
  G.items.push({k:kind,x:6+Math.random()*(GW-12),y:-4,v,ph:Math.random()*6});
}
function catchItem(it){
  const little=CH[cur].pic;
  if(it.k==='mud'){G.combo=0;G.stun=.9;sfx('bonk');burst(it.x,it.y,'#6b4a2b');G.floats.push({x:it.x-2,y:it.y-8,txt:'x',col:'#ff6b6b',life:.8});return}
  G.combo++;G.bestCombo=Math.max(G.bestCombo,G.combo);
  const mult=little?1:1+Math.min(4,Math.floor(G.combo/5));
  const pts=(it.k==='golden'?50:10)*mult*(G.fever?2:1);
  G.score+=pts;G.caught++;G.mouthT=.3;
  if(it.k==='golden'){G.gold++;sfx('gold');popup('GOLDEN STAR!','+'+pts)}else sfx('catch');
  burst(it.x,it.y,it.k==='golden'?GOLD:'#fff');
  G.floats.push({x:it.x-6,y:it.y-8,txt:'+'+pts,col:it.k==='golden'?GOLD:'#fff',life:.8});
}
function gameUpdate(dt){
  const little=CH[cur].pic,base=CH[cur].base;
  G.mouthT=Math.max(0,(G.mouthT||0)-dt);
  G.floats.forEach(f=>{f.y-=14*dt;f.life-=dt});G.floats=G.floats.filter(f=>f.life>0);
  G.parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=90*dt;p.life-=dt});G.parts=G.parts.filter(p=>p.life>0);
  if(G.keyDir)G.tx=Math.max(8,Math.min(GW-8,G.tx+G.keyDir*dt*75));
  G.x+=(G.tx-G.x)*Math.min(1,dt*(little?14:11));
  if(G.state==='count'){G.cd-=dt;if(G.cd<=0){G.state='play';sfx('tap')}return}
  if(G.state!=='play')return;
  G.time-=dt;G.elapsed+=dt;
  if(G.time<=8&&!G.fever){G.fever=true;popup('FEVER TIME!','Treats are worth x2');sfx('fever')}
  if(G.stun>0)G.stun-=dt;
  G.spawn-=dt;
  if(G.spawn<=0){spawnItem();G.spawn=((little?1.0:Math.max(.4,.8-G.elapsed*.009))*(G.fever?.6:1))+Math.random()*.15}
  const hw=little?14:8,cy=52+base;
  for(let i=G.items.length-1;i>=0;i--){
    const it=G.items[i];it.y+=it.v*dt;
    if(it.y>=cy-1&&it.y<cy+6&&Math.abs(it.x-G.x)<=hw&&G.stun<=0){catchItem(it);G.items.splice(i,1);continue}
    if(it.y>GH-5){if(it.k!=='mud')G.combo=0;G.items.splice(i,1)}
  }
  if(G.time<=0)endRound();
}
function gameDraw(g,t){
  const th=themeToday(),c=CH[cur],k=S.kids[cur],tier=tierFor(k.perfect),little=c.pic;
  drawBG(g,t,th);
  if(G.fever&&G.state==='play'&&((t*6)|0)%2){g.fillStyle='rgba(255,230,120,.18)';g.fillRect(0,0,GW,GH)}
  G.items.forEach(it=>drawItem(g,it.k,it.x,it.y,t));
  const ended=G.state==='end',hw=little?14:8,cy=52+c.base,px=Math.round(G.x);
  g.fillStyle='rgba(0,0,0,.25)';g.fillRect(px-9,GH-5,18,2);
  const sp=drawSprite(c,{tier,pose:'up',bob:Math.sin(t*5)>0,jump:ended?-Math.round(Math.abs(Math.sin(t*8))*3):0,
    mouth:G.stun>0?'sad':(ended||G.mouthT>0?'open':'smile'),blink:(t%3.6)>3.45,t,wig:0});
  g.drawImage(sp,px-16,40);
  if(!ended){
    g.fillStyle='#6b4a2b';g.fillRect(px-hw,cy-1,2*hw+1,1);
    g.fillStyle='#c58a52';g.fillRect(px-hw+1,cy,2*hw-1,3);
    g.fillStyle='#a8703a';for(let x=px-hw+2;x<px+hw;x+=3)g.fillRect(x,cy,1,3);
    g.fillStyle='#6b4a2b';g.fillRect(px-hw+1,cy+3,2*hw-1,1);
  }
  G.parts.forEach(p=>{g.fillStyle=p.col;g.fillRect(Math.round(p.x),Math.round(p.y),1,1)});
  G.floats.forEach(f=>{const x=Math.round(f.x),y=Math.round(f.y);drawText(g,f.txt,x+1,y+1,DK);drawText(g,f.txt,x,y,f.col)});
  if(G.state==='count'){const n=String(Math.max(1,Math.ceil(G.cd)));drawText(g,n,GW/2-5,25,DK,4);drawText(g,n,GW/2-6,24,'#fff',4)}
}
function gameDrawer(cv){
  const g=cv.getContext('2d');let lt=0,lastHud='';
  return t=>{
    if(!G)return;
    const dt=Math.min(.05,t-lt);lt=t;
    gameUpdate(dt);gameDraw(g,t);
    const hud=$('#hud');
    if(hud){
      if(G.state==='play'||G.state==='count'){
        const little=CH[cur].pic,len=G.len,pct=Math.max(0,Math.round(G.time/len*100));
        const h=`<div class="tb ${G.fever?'fev':''}"><i style="width:${pct}%"></i></div><span>⭐ ${G.score}</span>${!little&&G.combo>1?`<span>🔥${G.combo}</span>`:''}`;
        if(h!==lastHud){hud.innerHTML=h;lastHud=h}hud.classList.remove('hidden');
      }else{hud.classList.add('hidden');lastHud=''}
    }
  };
}
function bookHTML(g,fresh){
  const next=STICKERS.find(s=>!g.stickers[s.id]);
  return`<div class="small-t" style="margin-top:12px">TREAT BOOK · ${Object.keys(g.stickers).length}/${STICKERS.length}</div><div class="book">`+
    STICKERS.map(s=>{const has=g.stickers[s.id],nw=fresh&&fresh.includes(s.id);return`<div class="stk ${has?'':'lock'} ${nw?'new':''}" title="${esc(s.d)}"><b>${has?s.e:'❔'}</b>${has?esc(s.n):esc(s.d)}</div>`}).join('')+'</div>'+
    (next?`<div class="small-t" style="margin-top:8px">Next sticker: ${esc(next.d)}</div>`:'<div class="small-t" style="margin-top:8px">Every sticker collected!</div>');
}
function setGamePanel(){
  const p=$('#gpanel');if(!p||!G)return;
  const k=S.kids[cur],g=gstate(k),c=CH[cur],th=themeToday(),left=roundsLeft(k);
  if(G.state==='intro'){
    const nxt=THEMES[(new Date().getDay()+1)%7];
    p.innerHTML=`<div class="gp"><h3>${th.n.toUpperCase()}</h3><p>${c.pic?'Slide your basket to catch the yummy treats!':'Slide to catch treats. Dodge the mud! Golden stars are worth lots.'}</p>
     <p class="small-t">Best score: ${g.best} · Rounds left today: ${left}/${ROUNDS}</p>
     ${left>0?'<div class="btnrow"><button class="btn go" data-act="gstart">▶ START</button></div>':`<p>All done for today! Come back tomorrow for <b>${nxt.n}</b>.</p>`}
     ${bookHTML(g)}</div>`;
  }else if(G.state==='end'){
    const r=G.res,left2=roundsLeft(k);
    p.innerHTML=`<div class="gp"><h3>ROUND OVER!</h3><div class="stars">${'★'.repeat(r.stars)}${'☆'.repeat(3-r.stars)}</div>
     <p>Score <b>${r.score}</b> · Treats caught <b>${r.caught}</b></p>
     ${r.newBest?'<div class="newb">★ NEW BEST! ★</div>':`<p class="small-t">Best score: ${g.best}</p>`}
     <div class="btnrow">${left2>0?`<button class="btn go" data-act="gstart">▶ PLAY AGAIN (${left2} left)</button>`:''}<button class="btn" data-act="gback">BACK TO QUEST</button></div>
     ${left2<=0?`<p class="small-t">That's all the treats for today! Tomorrow: <b>${THEMES[(new Date().getDay()+1)%7].n}</b></p>`:''}
     ${r.fresh.length?`<div class="newb">NEW STICKER${r.fresh.length>1?'S':''}!</div>`:''}${bookHTML(g,r.fresh)}</div>`;
  }else p.innerHTML='';
}
function startRound(){
  const little=CH[cur].pic;
  Object.assign(G,{state:'count',cd:3,items:[],floats:[],parts:[],score:0,combo:0,bestCombo:0,caught:0,gold:0,len:little?40:45,time:little?40:45,elapsed:0,spawn:.4,stun:0,fever:false,mouthT:0});
  setGamePanel();sfx('tap');
}
function endRound(){
  const k=S.kids[cur],g=gstate(k),little=CH[cur].pic,today=todayStr();
  G.state='end';G.items=[];
  const th=little?[60,150,250]:[200,500,900];
  let stars=G.score>=th[2]?3:G.score>=th[1]?2:G.score>=th[0]?1:0;
  if(little)stars=Math.max(1,stars);
  const newBest=g.plays>0&&G.score>g.best;
  if(newBest)g.records++;
  if(G.score>g.best)g.best=G.score;
  g.plays++;g.total+=G.caught;g.gold+=G.gold;g.bestCombo=Math.max(g.bestCombo,G.bestCombo);
  if(stars===3)g.threeStars++;
  if(g.date!==today){g.date=today;g.rounds=0}g.rounds++;
  if(g.lastDay!==today){g.lastDay=today;g.dayCount++}
  const fresh=[];STICKERS.forEach(s=>{if(!g.stickers[s.id]&&s.t(g)){g.stickers[s.id]=today;fresh.push(s.id)}});
  G.res={score:G.score,caught:G.caught,stars,newBest,fresh};
  save();sfx('fanfare');if(stars>=2||fresh.length||newBest)confetti(50);
  setGamePanel();
}
function renderGame(){
  inGame=true;
  $('#select').classList.add('hidden');$('#questScreen').classList.add('hidden');
  const el=$('#gameScreen');el.classList.remove('hidden');
  el.innerHTML=`<div class="qtop"><button class="btn small" data-act="gback">◀ BACK</button><div class="qname">TREAT TIME</div></div>
   <div class="panel hero gwrap"><div id="hud" class="hud hidden"></div><canvas id="gc" width="${GW}" height="${GH}"></canvas><div id="gpanel"></div></div>`;
  G={state:'intro',x:GW/2,tx:GW/2,items:[],floats:[],parts:[],score:0,combo:0,time:0,len:45,mouthT:0,stun:0,keyDir:0};
  const cv=el.querySelector('#gc');
  const setX=e=>{const r=cv.getBoundingClientRect();G.tx=Math.max(8,Math.min(GW-8,(e.clientX-r.left)/r.width*GW))};
  cv.addEventListener('pointerdown',e=>{if(cv.setPointerCapture)try{cv.setPointerCapture(e.pointerId)}catch(x){}setX(e)});
  cv.addEventListener('pointermove',setX);
  drawers=[gameDrawer(cv)];
  setGamePanel();window.scrollTo(0,0);
}
document.addEventListener('keydown',e=>{if(!G)return;if(e.key==='ArrowLeft')G.keyDir=-1;if(e.key==='ArrowRight')G.keyDir=1});
document.addEventListener('keyup',e=>{if(!G)return;if(e.key==='ArrowLeft'||e.key==='ArrowRight')G.keyDir=0});

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,id=el.dataset.id;
  if(a==='start'){ensureAudio();if(S.music)startMusic();$('#start').classList.add('hidden');sfx('tap');return}
  if(a==='music'){S.music=!S.music;save();syncAudioBtns();if(S.music)startMusic();else stopMusic();return}
  if(a==='sfx'){S.sfx=!S.sfx;save();syncAudioBtns();return}
  if(a==='pick'){cur=id;edit=false;sfx('tap');renderQuest();window.scrollTo(0,0);return}
  if(a==='back'){renderSelect();return}
  if(a==='new'){popup('SLOT RESERVED','New players coming soon!');sfx('tap');return}
  if(a==='tog'){toggleTask(id);return}
  if(a==='edit'){if(edit){edit=false;renderQuest()}else if(await askPin('PARENT PIN')){edit=true;renderQuest()}return}
  if(a==='del'){const k=S.kids[cur];k.tasks=k.tasks.filter(t=>t.id!==id);save();renderQuest();
    if(k.tasks.length&&!k.day.awarded&&k.tasks.every(t=>k.day.done[t.id]))award(cur);return}
  if(a==='add'){const inp=$('#newtask');const v=(inp.value||'').trim();if(!v)return;S.kids[cur].tasks.push({id:uid(),text:v});save();renderQuest();const n=$('#newtask');if(n)n.focus();return}
  if(a==='addpic'){
    openModal(`<h3>ADD A PICTURE CHORE</h3>${Object.keys(KINDS).map(k=>`<button class="btn opt" data-act="pickkind" data-id="${k}">${esc(KINDS[k])}</button>`).join('')}
      <input id="ctext" placeholder="Or type your own…" maxlength="40" style="font-size:22px;letter-spacing:0;margin-top:12px">
      <button class="btn gold opt" data-act="customkind">ADD CUSTOM (⭐ ANIMATION)</button><button class="btn opt" data-act="close">CANCEL</button>`);return}
  if(a==='pickkind'){S.kids[cur].tasks.push({id:uid(),text:KINDS[id],k:id});save();closeModal();renderQuest();return}
  if(a==='customkind'){const v=($('#ctext').value||'').trim();if(!v)return;S.kids[cur].tasks.push({id:uid(),text:v,k:'custom'});save();closeModal();renderQuest();return}
  if(a==='daddy'){daddy();return}
  if(a==='forgive'){closeModal();forgive(cur);return}
  if(a==='finishtoday'){closeModal();completeToday(cur);return}
  if(a==='close'){closeModal();return}
  if(a==='resettoday'){
    const k=S.kids[cur],d=k.day;
    k.exp=Math.max(0,k.exp-d.earned);
    if(d.awarded)k.perfect=Math.max(0,k.perfect-1);
    k.day=freshDay();
    const g=gstate(k);if(g.date===todayStr())g.rounds=0;
    save();closeModal();renderQuest();popup('DAY RESET','Fresh start for today!');return}
  if(a==='resetall'){
    openModal(`<h3>RESET ALL PROGRESS?</h3><p style="font-size:22px;line-height:1.1;margin:0 0 6px">This sets ${esc(CH[cur].name)} back to Level 1 with no rank, stickers or best score. Chore lists stay.</p>
     <div class="row2"><button class="btn" data-act="close">CANCEL</button><button class="btn go" data-act="resetallyes">YES, RESET</button></div>`);return}
  if(a==='resetallyes'){
    const k=S.kids[cur];k.exp=0;k.perfect=0;k.misses=[];k.sad=false;k.day=freshDay();delete k.game;gstate(k);
    save();closeModal();renderQuest();popup('RESET COMPLETE','Back to the start!');return}
  if(a==='celgame'){closeModal();if(cur&&S.kids[cur].day.awarded){sfx('tap');renderGame()}return}
  if(a==='play'){if(S.kids[cur].day.awarded){sfx('tap');renderGame()}return}
  if(a==='locked'){sfx('sad');popup('LOCKED','Finish all chores to play!');return}
  if(a==='gstart'){if(G&&roundsLeft(S.kids[cur])>0&&(G.state==='intro'||G.state==='end'))startRound();return}
  if(a==='gback'){renderQuest();return}
});
document.addEventListener('change',e=>{
  if(e.target.classList.contains('tin')){const t=S.kids[cur].tasks.find(x=>x.id===e.target.dataset.id);if(t){t.text=e.target.value.trim()||t.text;save()}}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='newtask'){const b=document.querySelector('[data-act="add"]');if(b)b.click()}});
function syncAudioBtns(){$('#bMusic').classList.toggle('off',!S.music);$('#bSfx').classList.toggle('off',!S.sfx)}

/* ---------- loop ---------- */
let last=0;
function loop(ts){
  if(ts-last>=33){last=ts;const t=ts/1000;drawers.forEach(f=>f(t));modalDrawers.forEach(f=>f(t))}
  requestAnimationFrame(loop);
}
rollover();syncAudioBtns();renderSelect();
setInterval(rollover,30000);
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
